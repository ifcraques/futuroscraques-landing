<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 520" role="img" aria-label="NAR — Núcleo de Alto Rendimento Esportivo de São Paulo">
  <defs>
    <linearGradient id="narGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2553c8"/>
      <stop offset="1" stop-color="#10b39a"/>
    </linearGradient>
  </defs>

  <!-- Círculo com gradiente -->
  <circle cx="260" cy="260" r="232" fill="url(#narGrad)"/>

  <!-- Wordmark NAR -->
  <g fill="#ffffff" font-family="'Outfit', 'Segoe UI', Arial, sans-serif" font-weight="700">
    <text x="112" y="320" font-size="160">N</text>
    <text x="330" y="320" font-size="160">R</text>
    <!-- A estilizado: perna direita grossa + lâmina diagonal fina -->
    <polygon points="271,176 293,176 332,320 306,320"/>
    <polygon points="303,94 315,100 249,320 237,320"/>
  </g>

  <!-- Texto institucional -->
  <g fill="#6b7280" font-family="'Outfit', 'Segoe UI', Arial, sans-serif" font-weight="500" font-size="58" letter-spacing="2">
    <text x="560" y="154">NÚCLEO DE ALTO</text>
    <text x="560" y="248">RENDIMENTO</text>
    <text x="560" y="342">ESPORTIVO</text>
    <text x="560" y="436">DE SÃO PAULO</text>
  </g>
</svg>
